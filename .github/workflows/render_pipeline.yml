name: OpenMontage Automated Video Pipeline

on:
  push:                    # 👈 한 번 자동 등록을 유도하기 위해 추가
    branches: [ main ]
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:      # 수동 실행

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies & OpenMontage Repository
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # PyPI 패키지가 없을 경우 GitHub 저장소에서 direct install
          pip install git+https://github.com/calesthio/OpenMontage.git || true

      - name: [Step 1] Generate Episode Input Data via Python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: [Step 2] Execute OpenMontage CLI Rendering
        env:
          KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          python -m openmontage render \
            --template openmontage_config/template.json \
            --input track_input.json \
            --output output_final.mp4

      - name: [Step 3] Auto Upload to YouTube
        if: success()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -c "import youtube_uploader; youtube_uploader.upload_private_video('output_final.mp4')"

      - name: Upload Rendered Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-episode-video
          path: output_final.mp4
          retention-days: 7
